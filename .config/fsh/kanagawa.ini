[base]
default          = #DCD7BA  # fuji_white
unknown-token    = #D27E99  # sakura_pink
commandseparator = #7FB4CA  # spring_blue
redirection      = #7E9CD8  # crystal_blue
here-string-tri  = #7E9CD8  # crystal_blue
here-string-text = #7E9CD8  # crystal_blue
here-string-var  = #7E9CD8  # crystal_blue
exec-descriptor  = #DCA561  # autumn_yellow
comment          = #727169  # fuji_gray
correct-subtle   = #7E9CD8  # crystal_blue
incorrect-subtle = #D27E99  # sakura_pink
subtle-separator = #54546D  # sumi_ink_6
subtle-bg        = #2A2A37  # sumi_ink_4
secondary        = #C8C093  # old_white
recursive-base   = #DCD7BA  # fuji_white

[command-point]
reserved-word     = #957FB8  # oni_violet
subcommand        = #7FB4CA  # spring_blue
alias             = #7E9CD8  # crystal_blue
suffix-alias      = #7E9CD8  # crystal_blue
global-alias      = #7E9CD8  # crystal_blue
builtin           = #B8B4D0  # oni_violet_2
function          = #7E9CD8  # crystal_blue
command           = #7E9CD8  # crystal_blue
precommand        = #9CABCA  # spring_violet_2
hashed-command    = #7E9CD8  # crystal_blue
single-sq-bracket = #E6C384  # carp_yellow
double-sq-bracket = #E6C384  # carp_yellow
double-paren      = #76946A  # autumn_green

[paths]
path          = #C8C093  # old_white
pathseparator = #727169  # fuji_gray
path-to-dir   = #DCD7BA  # fuji_white
globbing      = #D27E99  # sakura_pink
globbing-ext  = #7FB4CA  # spring_blue

[brackets]
paired-bracket  = bold
bracket-level-1 = #957FB8  # oni_violet
bracket-level-2 = #E6C384  # carp_yellow
bracket-level-3 = #7FB4CA  # spring_blue

[arguments]
single-hyphen-option   = #7FB4CA  # spring_blue
double-hyphen-option   = #7FB4CA  # spring_blue
back-quoted-argument   = #7FB4CA  # spring_blue
single-quoted-argument = #98BB6C  # spring_green
double-quoted-argument = #98BB6C  # spring_green
dollar-quoted-argument = #98BB6C  # spring_green
optarg-string          = #98BB6C  # spring_green
optarg-number          = #DCA561  # autumn_yellow

[in-string]
back-dollar-quoted-argument           = #DCA561  # autumn_yellow
back-or-dollar-double-quoted-argument = #DCA561  # autumn_yellow

[other]
variable             = #DCA561  # autumn_yellow
assign               = #7E9CD8  # crystal_blue
assign-array-bracket = #7E9CD8  # crystal_blue
history-expansion    = #957FB8  # oni_violet

[math]
mathvar = #957FB8  # oni_violet
mathnum = #DCA561  # autumn_yellow
matherr = #D27E99,bold  # sakura_pink

[for-loop]
forvar  = #DCD7BA  # fuji_white
fornum  = #DCA561  # autumn_yellow
foroper = #7E9CD8  # crystal_blue
forsep  = #7E9CD8  # crystal_blue

[case]
case-input       = #DCA561  # autumn_yellow
case-parentheses = #938AA9  # spring_violet_1
case-condition   = #957FB8  # oni_violet
